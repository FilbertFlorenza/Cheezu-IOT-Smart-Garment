name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Tests and static checks
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: garment_defect_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, bcmath, gd, intl, zip, pcntl
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Build frontend assets
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Run test suite
        run: php artisan test

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Compile Blade templates
        run: php artisan view:cache

  container:
    name: Container build
    runs-on: ubuntu-latest
    needs: backend

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: garment_defect_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: garment-defect:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the image against MySQL
        run: |
          set -euo pipefail

          cleanup() {
            docker logs garment-defect-ci || true
            docker rm --force garment-defect-ci || true
          }
          trap cleanup EXIT

          docker run --detach --name garment-defect-ci --network host \
            --env APP_ENV=production \
            --env APP_KEY="base64:$(head -c 32 /dev/urandom | base64)" \
            --env APP_DEBUG=false \
            --env APP_URL=http://127.0.0.1 \
            --env LOG_CHANNEL=stderr \
            --env DB_CONNECTION=mysql \
            --env DB_HOST=127.0.0.1 \
            --env DB_PORT=3306 \
            --env DB_DATABASE=garment_defect_test \
            --env DB_USERNAME=root \
            --env DB_PASSWORD= \
            --env CACHE_STORE=file \
            --env SESSION_DRIVER=file \
            --env QUEUE_CONNECTION=sync \
            --env RUN_MIGRATIONS=true \
            --env WAIT_FOR_DB=true \
            --env OPTIMIZE=true \
            garment-defect:ci

          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1/up >/dev/null 2>&1; then
              echo "Container is healthy after ${attempt} attempts."
              curl --fail --silent http://127.0.0.1/api/v1/health
              exit 0
            fi
            sleep 2
          done

          echo "Container did not become healthy in time."
          exit 1
