name: garment-defect

# Local/demo stack for the Smart Garment Defect Detection backend.
#
#   cp .env.docker.example .env.docker
#   # edit .env.docker and replace every change-me value
#   docker compose --env-file .env.docker up --build
#
# Secrets are never baked into the file. Values are resolved from the shell or
# from the file passed with --env-file.

x-app-environment: &app-environment
  APP_NAME: ${APP_NAME:-Garment QC}
  APP_ENV: ${APP_ENV:-local}
  APP_DEBUG: ${APP_DEBUG:-true}
  APP_KEY: ${APP_KEY:?Set APP_KEY in .env.docker}
  APP_URL: ${APP_URL:-http://localhost:8080}
  APP_DISPLAY_TIMEZONE: ${APP_DISPLAY_TIMEZONE:-Asia/Manila}
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: "3306"
  DB_DATABASE: ${DB_DATABASE:-garment_defect}
  DB_USERNAME: ${DB_USERNAME:-garment}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.docker}
  CACHE_STORE: database
  SESSION_DRIVER: database
  QUEUE_CONNECTION: sync
  FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
  INSPECTION_IMAGE_DISK: ${INSPECTION_IMAGE_DISK:-local}
  INSPECTION_IMAGE_MAX_KB: ${INSPECTION_IMAGE_MAX_KB:-5120}
  INSPECTION_ONLINE_THRESHOLD_MINUTES: ${INSPECTION_ONLINE_THRESHOLD_MINUTES:-15}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@garment.test}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env.docker}
  OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:?Set OPERATOR_PASSWORD in .env.docker}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
  AWS_BUCKET: ${AWS_BUCKET:-}
  AWS_ENDPOINT: ${AWS_ENDPOINT:-}
  AWS_USE_PATH_STYLE_ENDPOINT: ${AWS_USE_PATH_STYLE_ENDPOINT:-false}
  WAIT_FOR_DB: "true"
  DB_WAIT_ATTEMPTS: ${DB_WAIT_ATTEMPTS:-30}
  RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
  RUN_SEED: ${RUN_SEED:-true}
  OPTIMIZE: ${OPTIMIZE:-true}

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: garment-defect:local
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${APP_PORT:-8080}:80"
    environment: *app-environment
    volumes:
      - app-storage:/var/www/html/storage/app
      - app-logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-garment_defect}
      MYSQL_USER: ${DB_USERNAME:-garment}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.docker}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env.docker}
    ports:
      - "${DB_PORT_FORWARD:-3307}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  db-data:
  app-storage:
  app-logs:
